# ==============================================================================
# EL BAHLI STORE — NGINX SERVER CONFIGURATION (HOSTINGER VPS / CLOUD SERVER)
# ==============================================================================
# Emplacement recommandé sur le serveur : /etc/nginx/sites-available/elbahlistore.conf
# Lien symbolique d'activation : ln -s /etc/nginx/sites-available/elbahlistore.conf /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Redirection HTTP vers HTTPS (Port 80 -> 443)
server {
    listen 80;
    listen [::]:80;
    server_name elbahlistore.ma www.elbahlistore.ma;

    # Défi Certbot / ACME pour renouvellement automatique Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Serveur Principal HTTPS (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elbahlistore.ma www.elbahlistore.ma;

    # Certificats SSL (générés via certbot --nginx)
    ssl_certificate /etc/letsencrypt/live/elbahlistore.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elbahlistore.ma/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/elbahlistore.ma/chain.pem;

    # Paramètres SSL stricts
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Racine du Frontend SPA (React / Vite Build)
    root /var/www/el-bahli-store/Frontend/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # --------------------------------------------------------------------------
    # EN-TÊTES DE SÉCURITÉ HTTP DE PRODUCTION
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # --------------------------------------------------------------------------
    # COMPRESSION GZIP & BROTLI
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # CACHE POUR LES ACTIFS STATIQUES VERSIONNÉS DU FRONTEND
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpe?g|gif|svg|webp|avif)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # FICHIERS UPLOADÉS ET STOCKAGE LARAVEL (/storage/)
    # --------------------------------------------------------------------------
    location /storage/ {
        alias /var/www/el-bahli-store/Backend/storage/app/public/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # API BACKEND LARAVEL (/api/ et /sanctum/)
    # --------------------------------------------------------------------------
    location ^~ /api/ {
        root /var/www/el-bahli-store/Backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.5-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/el-bahli-store/Backend/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/el-bahli-store/Backend/public;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 60s;
        }
    }

    location ^~ /sanctum/ {
        root /var/www/el-bahli-store/Backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.5-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/el-bahli-store/Backend/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/el-bahli-store/Backend/public;
        }
    }

    # --------------------------------------------------------------------------
    # FRONTEND ROUTING SPA (FALLBACK SUR index.html)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # PROTECTION DES FICHIERS CACHÉS ET SENSIBLES
    # --------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(Backend|Frontend|node_modules|vendor|\.git|\.env) {
        deny all;
        return 404;
    }

    # Logs
    access_log /var/log/nginx/elbahli_access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/elbahli_error.log warn;
}
